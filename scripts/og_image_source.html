<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080D12;
    --ok: #46E0A0;
    --warn: #F3B54A;
    --text: #E8EDF3;
    --muted: #B4C0CE;
  }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--bg);
    background-image:
      linear-gradient(rgba(125,148,178,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(125,148,178,0.045) 1px, transparent 1px);
    background-size: 40px 40px;
    font-family: "Space Grotesk", system-ui, sans-serif;
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* corner brackets */
  .br { position: absolute; }
  .br-tl { top: 16px; left: 26px; width: 52px; height: 76px; border-left: 3px solid var(--ok); border-top: 3px solid var(--ok); }
  .br-bl { bottom: 16px; left: 26px; width: 52px; height: 76px; border-left: 3px solid var(--ok); border-bottom: 3px solid var(--ok); }
  .rule-t { position: absolute; top: 18px; left: 92px; right: 120px; height: 1px; background: rgba(125,148,178,.30); }
  .rule-b { position: absolute; bottom: 18px; left: 170px; right: 200px; height: 1px; background: rgba(125,148,178,.30); }

  .dots { position: absolute; display: flex; gap: 7px; }
  .dots i { width: 7px; height: 7px; background: var(--ok); display: block; }
  .dots.amber i { background: var(--warn); }
  .dots.tr { top: 15px; right: 30px; }
  .dots.bl { bottom: 15px; left: 96px; }
  .dash { position: absolute; height: 4px; background: var(--warn); }
  .dash.b1 { bottom: 17px; right: 128px; width: 30px; }
  .dot-sq { position: absolute; width: 6px; height: 6px; background: var(--muted); opacity: .5; }
  .dot-sq.t1 { top: 20px; right: 92px; }
  .dot-sq.b1 { bottom: 20px; right: 178px; }

  /* right-hand tech frame */
  .frame { position: absolute; top: 96px; right: 26px; width: 108px; height: 438px; }
  .frame svg { width: 100%; height: 100%; }
  .stack-lines { position: absolute; top: 128px; right: 46px; display: grid; gap: 6px; }
  .stack-lines i { display: block; width: 34px; height: 3px; background: var(--muted); opacity: .55; }
  .vdots { position: absolute; top: 178px; right: 60px; display: grid; gap: 16px; }
  .vdots i { display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); opacity: .75; }

  /* content */
  .content { position: absolute; left: 60px; top: 128px; right: 170px; }
  .name {
    display: flex; align-items: center; gap: 26px;
    margin-bottom: 30px;
  }
  .bar { width: 8px; height: 78px; background: var(--ok); border-radius: 1px; flex: none; }
  h1 {
    font-size: 78px; font-weight: 700; letter-spacing: -2.4px;
    color: var(--text); line-height: 1;
  }

  .row { display: flex; align-items: center; gap: 20px; margin-bottom: 21px; }
  .ico { width: 44px; flex: none; display: flex; justify-content: center; }
  .ico svg { width: 34px; height: 34px; fill: none; stroke-width: 2; }
  .sep { width: 2px; height: 30px; background: rgba(125,148,178,.42); flex: none; }

  .r1 { font-size: 40px; font-weight: 700; color: var(--ok); letter-spacing: -.8px; }
  .r2 { font-size: 33px; font-weight: 500; color: var(--text); letter-spacing: -.4px; }
  .r3 { font-family: "JetBrains Mono", monospace; font-size: 23px; font-weight: 400; color: var(--muted); letter-spacing: -.5px; }
  .r4 { font-family: "JetBrains Mono", monospace; font-size: 23px; font-weight: 400; color: var(--warn); letter-spacing: -.5px; }
</style>
</head>
<body>
  <div class="br br-tl"></div>
  <div class="br br-bl"></div>
  <div class="rule-t"></div>
  <div class="rule-b"></div>
  <div class="dots tr"><i></i><i></i><i></i><i></i></div>
  <div class="dots bl"><i></i><i></i><i></i><i></i></div>
  <div class="dots amber bl" style="left:auto; right:60px; bottom:15px;"><i></i><i></i><i></i></div>
  <div class="dash b1"></div>
  <div class="dot-sq t1"></div>
  <div class="dot-sq b1"></div>

  <div class="frame">
    <svg viewBox="0 0 108 438" preserveAspectRatio="none">
      <path d="M22 2 L2 26 L2 412 L22 436 L106 436" fill="none" stroke="rgba(125,148,178,.34)" stroke-width="2"/>
      <path d="M40 84 L64 84" stroke="rgba(125,148,178,.34)" stroke-width="2"/>
    </svg>
  </div>
  <div class="stack-lines"><i></i><i></i><i></i></div>
  <div class="vdots"><i></i><i></i><i></i></div>

  <div class="content">
    <div class="name">
      <span class="bar"></span>
      <h1>Enrie John Edem</h1>
    </div>

    <div class="row">
      <span class="ico"><svg viewBox="0 0 24 24" stroke="#46E0A0"><rect x="2.5" y="3.5" width="19" height="5.5" rx="1.4"/><rect x="2.5" y="12.5" width="19" height="5.5" rx="1.4"/><path d="M6 6.2h.01M6 15.2h.01M9.4 6.2h.01M9.4 15.2h.01"/></svg></span>
      <span class="sep"></span>
      <span class="r1">Infrastructure &amp; Platform Engineer</span>
    </div>

    <div class="row">
      <span class="ico"><svg viewBox="0 0 24 24" stroke="#F3B54A"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.2v3M12 18.8v3M2.2 12h3M18.8 12h3M5.1 5.1l2.1 2.1M16.8 16.8l2.1 2.1M18.9 5.1l-2.1 2.1M7.2 16.8l-2.1 2.1"/></svg></span>
      <span class="sep"></span>
      <span class="r2">Linux · Proxmox VE · Ansible · Terraform</span>
    </div>

    <div class="row">
      <span class="ico"><svg viewBox="0 0 24 24" stroke="#46E0A0"><path d="M3 18.5 L9 12 L13 16 L21 6.5"/><path d="M16 6.5h5v5"/></svg></span>
      <span class="sep"></span>
      <span class="r3">7 hosts · 36 workloads · 93% faster builds · ~700 staff</span>
    </div>

    <div class="row">
      <span class="ico"><svg viewBox="0 0 24 24" stroke="#F3B54A"><path d="M12 21.5s7.2-6.1 7.2-11a7.2 7.2 0 1 0-14.4 0c0 4.9 7.2 11 7.2 11Z"/><circle cx="12" cy="10.3" r="2.6"/></svg></span>
      <span class="sep"></span>
      <span class="r4">Metro Manila · Open to remote or relocation</span>
    </div>
  </div>
</body>
</html>
